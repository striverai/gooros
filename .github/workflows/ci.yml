name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Smoke test
        run: python tests/smoke.py

      - name: Install plan from env file
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/customer.env" <<'ENV'
          GOOROS_OWNER_NAME="CI Owner"
          GOOROS_OWNER_WORK="CI"
          GOOROS_OWNER_FOCUS="Smoke"
          GOOROS_TIMEZONE="Asia/Ho_Chi_Minh"
          TELEGRAM_BOT_TOKEN="123456789:CI_TOKEN"
          TELEGRAM_CHAT_ID="-1001"
          TELEGRAM_ALLOWED_USERS="42"
          TELEGRAM_THREAD_SCOUT="11"
          TELEGRAM_THREAD_SCRIBE="12"
          TELEGRAM_THREAD_REACH="13"
          TELEGRAM_THREAD_DEV="14"
          TELEGRAM_HOME_CHANNEL="telegram:-1001"
          GOOROS_PUBLIC_IP="203.0.113.10"
          GOOROS_ACME_EMAIL="ci@example.com"
          GOOROS_DASH_USER="gooros"
          GOOROS_MODEL_POLICY="deepseek-free-first"
          ENV
          gooros-hermes plan --env-file "$tmp/customer.env" --with-hermes --with-9router --with-public-dashboards

      - name: Update plan dry run
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/project/.gooros" "$tmp/config" "$tmp/data" "$tmp/hermes"
          cat > "$tmp/project/.gooros/installed.json" <<'JSON'
          {"product":"gooros-hermes-mission-control","version":"0.0.1","schema_version":1,"installed_at":"20260101T000000Z","public_dashboards":false,"with_9router":false,"systemd":false}
          JSON
          cat > "$tmp/config/customer.yaml" <<'YAML'
          owner_name: CI Owner
          owner_work: CI
          owner_focus: Smoke
          timezone: Asia/Ho_Chi_Minh
          telegram_chat_id: -1001
          thread_scout: 11
          thread_scribe: 12
          thread_reach: 13
          thread_dev: 14
          telegram_home_channel: telegram:-1001
          public_ip:
          acme_email:
          dash_user: gooros
          model_policy: deepseek-free-first
          YAML
          gooros-hermes update --plan --source-dir . --project-dir "$tmp/project" --config-dir "$tmp/config" --data-dir "$tmp/data" --hermes-home "$tmp/hermes"
